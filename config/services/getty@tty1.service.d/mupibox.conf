# MuPiBox: the kiosk (the display) starts from the autologin on tty1. getty@.service is Type=idle: systemd holds the
# start until the other start-up jobs are done, at most 5 s - to keep boot messages and the login prompt apart, which
# the box does not need (its messages go to tty3, tty1 shows the boot screen). The display started 5 s later for it.
[Service]
Type=simple
# KN: getty@.service deallocates tty1 when it starts (TTYVTDisallocate=yes), and that clears the screen: the boot
# screen (splash_screen.sh, 2.5 s earlier) was gone, blue for the 6 s until the display came (recorded at boot on
# Jakob's box). Nothing on tty1 needs that cleaning - the kiosk covers it.
TTYVTDisallocate=no
